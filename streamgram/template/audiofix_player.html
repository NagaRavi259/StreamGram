<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%s</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #0b0b0d; color: #eee;
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }
        header {
            padding: 10px 16px; background: #141417; font-weight: 600;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .player-wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
        /* Fixed aspect-ratio box (set inline from the real probed resolution) so the player
           never visibly resizes on a seek/track-switch reload — a plain <video> collapses to no
           intrinsic size until the new segment's metadata loads, which otherwise makes the whole
           page jump every time. The video itself fits inside via object-fit, whatever its own
           reported size ends up being. */
        .video-box {
            position: relative; background: #000; border-radius: 6px; overflow: hidden;
            width: 100%%; max-height: 80vh; margin: 0 auto;
        }
        video { display: block; width: 100%%; height: 100%%; object-fit: contain; background: #000; }
        .video-box.loading::after {
            content: ""; position: absolute; top: 50%%; left: 50%%; width: 44px; height: 44px;
            margin: -22px 0 0 -22px; border: 4px solid rgba(255,255,255,0.25);
            border-top-color: #fff; border-radius: 50%%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .controls {
            display: flex; align-items: center; gap: 10px; padding: 10px 6px; flex-wrap: wrap;
        }
        .controls button {
            background: #1d1d22; color: #eee; border: 1px solid #333; border-radius: 6px;
            width: 38px; height: 34px; cursor: pointer; font-size: 16px;
        }
        .controls button:hover { background: #2a2a31; }
        #seek { flex: 1 1 260px; min-width: 160px; accent-color: #6c8cff; }
        #vol { width: 80px; accent-color: #6c8cff; }
        #time-label { font-size: 13px; color: #bbb; min-width: 108px; text-align: right; }
        #audio-track {
            background: #1d1d22; color: #eee; border: 1px solid #333; border-radius: 6px;
            height: 34px; padding: 0 6px; font-size: 13px; max-width: 160px;
        }
        #audio-track:empty, #audio-track[data-hidden] { display: none; }
        .note {
            font-size: 12.5px; color: #9a9a9a; padding: 0 6px 10px; line-height: 1.5;
        }
        .error-banner {
            display: none; background: #3a1414; border: 1px solid #7a2b2b; color: #ffdede;
            padding: 10px 12px; border-radius: 6px; margin: 0 6px 10px; font-size: 13.5px;
        }
        .error-banner button {
            margin-left: 10px; background: #7a2b2b; border: none; color: #fff; border-radius: 4px;
            padding: 4px 10px; cursor: pointer;
        }
        footer { text-align: center; padding: 18px; color: #777; font-size: 12px; }
        footer a { color: #9ab2ff; text-decoration: none; }
    </style>
</head>
<body>
    <header>%s</header>
    <div class="player-wrap">
        <div class="video-box loading" id="video-box" style="aspect-ratio: %s;">
            <video id="v" playsinline></video>
        </div>
        <div class="error-banner" id="error-banner">
            Playback hit a snag (seek point or a transcode hiccup).
            <button id="retry-btn">Retry</button>
        </div>
        <div class="controls">
            <button id="play-btn" title="Play/Pause">▶</button>
            <input type="range" id="seek" min="0" value="0" step="1">
            <span id="time-label">00:00 / 00:00</span>
            <span>🔊</span>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="1">
            <select id="audio-track" title="Audio language"></select>
            <button id="fs-btn" title="Fullscreen">⛶</button>
        </div>
        <div class="note">
            Audio fixed for in-browser playback (original audio codec isn't supported by this
            browser). Seeking restarts the stream from the chosen point — a short pause while it
            reconnects is expected.
        </div>
    </div>

    <script>
    (function () {
        var video = document.getElementById('v');
        var videoBox = document.getElementById('video-box');
        var seekBar = document.getElementById('seek');
        var timeLabel = document.getElementById('time-label');
        var playBtn = document.getElementById('play-btn');
        var volBar = document.getElementById('vol');
        var fsBtn = document.getElementById('fs-btn');
        var errorBanner = document.getElementById('error-banner');
        var retryBtn = document.getElementById('retry-btn');
        var trackSelect = document.getElementById('audio-track');

        var totalDuration = %s;
        var baseStreamUrl = %s;
        var audioTracks = %s;      // [{index, language, title, codec, default}, ...]
        var currentTrackIndex = %s; // the per-type audio index currently playing
        var baseOffset = 0;      // seconds: the `start=` value of the segment currently loading/loaded
        var seeking = false;     // true while the user is dragging the seek bar
        var wantPlaying = false; // whether playback should resume once the new segment is ready

        function trackLabel(t) {
            var lang = (t.language || 'und').toUpperCase();
            return t.title ? (lang + ' — ' + t.title) : lang;
        }

        if (audioTracks.length > 1) {
            audioTracks.forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = String(t.index);
                opt.textContent = trackLabel(t);
                if (t.index === currentTrackIndex) opt.selected = true;
                trackSelect.appendChild(opt);
            });
        } else {
            trackSelect.setAttribute('data-hidden', '');
        }

        function fmtTime(s) {
            if (!isFinite(s) || s < 0) s = 0;
            s = Math.floor(s);
            var h = Math.floor(s / 3600), m = Math.floor((s %% 3600) / 60), sec = s %% 60;
            var mm = (h > 0 ? String(m).padStart(2, '0') : String(m));
            var ss = String(sec).padStart(2, '0');
            return h > 0 ? h + ':' + mm + ':' + ss : mm + ':' + ss;
        }

        function streamUrlAt(offsetSeconds) {
            var sep = baseStreamUrl.indexOf('?') === -1 ? '?' : '&';
            return baseStreamUrl + sep + 'start=' + encodeURIComponent(Math.max(0, offsetSeconds)) +
                '&atrack=' + encodeURIComponent(currentTrackIndex);
        }

        function loadAt(offsetSeconds, autoplay) {
            baseOffset = Math.max(0, Math.min(offsetSeconds, Math.max(0, totalDuration - 1)));
            videoBox.classList.add('loading');
            errorBanner.style.display = 'none';
            video.src = streamUrlAt(baseOffset);
            video.load();
            if (autoplay) {
                video.addEventListener('canplay', function onReady() {
                    video.removeEventListener('canplay', onReady);
                    video.play().catch(function () {});
                }, { once: true });
            }
        }

        // 'canplay'/'loadeddata' fire once the video is actually ready to play, whether or not
        // playback has started yet — without this, a freshly-loaded-but-still-paused video (no
        // autoplay) shows the loading spinner forever even though pressing play works instantly.
        video.addEventListener('playing', function () { videoBox.classList.remove('loading'); });
        video.addEventListener('canplay', function () { videoBox.classList.remove('loading'); });
        video.addEventListener('loadeddata', function () { videoBox.classList.remove('loading'); });
        video.addEventListener('waiting', function () { videoBox.classList.add('loading'); });
        video.addEventListener('error', function () {
            videoBox.classList.remove('loading');
            errorBanner.style.display = 'block';
        });

        video.addEventListener('timeupdate', function () {
            if (seeking) return;
            var abs = baseOffset + video.currentTime;
            if (totalDuration > 0) seekBar.value = Math.min(abs, totalDuration);
            timeLabel.textContent = fmtTime(abs) + ' / ' + fmtTime(totalDuration);
        });

        seekBar.addEventListener('input', function () {
            seeking = true;
            timeLabel.textContent = fmtTime(Number(seekBar.value)) + ' / ' + fmtTime(totalDuration);
        });
        seekBar.addEventListener('change', function () {
            seeking = false;
            wantPlaying = !video.paused;
            loadAt(Number(seekBar.value), wantPlaying);
        });

        playBtn.addEventListener('click', function () {
            if (video.paused) video.play().catch(function () {}); else video.pause();
        });
        video.addEventListener('play', function () { playBtn.textContent = '⏸'; });
        video.addEventListener('pause', function () { playBtn.textContent = '▶'; });

        volBar.addEventListener('input', function () { video.volume = Number(volBar.value); });

        trackSelect.addEventListener('change', function () {
            var newIndex = Number(trackSelect.value);
            if (newIndex === currentTrackIndex) return;
            currentTrackIndex = newIndex;
            var resumeAt = baseOffset + video.currentTime;
            var wasPlaying = !video.paused;
            loadAt(resumeAt, wasPlaying);
        });

        fsBtn.addEventListener('click', function () {
            if (video.requestFullscreen) video.requestFullscreen();
            else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
        });

        retryBtn.addEventListener('click', function () {
            loadAt(baseOffset, true);
        });

        if (totalDuration > 0) seekBar.max = totalDuration;
        loadAt(0, false);
    })();
    </script>
</body>
</html>
